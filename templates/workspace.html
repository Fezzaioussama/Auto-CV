<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | AutoCV Studio</title>
    {% include "_brand_meta.html" %}
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <link rel="stylesheet" href="/static/features.css?v=1">
</head>
<body>
    <nav class="nav" id="navbar">
        <div class="shell nav-inner">
            <a class="brand" href="/">
                <span class="logo logo-image"><img src="/static/assets/autocv-logo.png" alt="" aria-hidden="true"></span>
                <span class="name">Auto<span>CV</span></span>
            </a>
            <div class="nav-links">
                <a class="navlink" href="/#app">Optimizer</a>
                <a class="navlink" href="/interview">Interview Prep</a>
                <a class="navlink" href="/workspace">Workspace</a>
                <a class="navlink" href="/how-it-works">How it works</a>
                <span id="navAuth" class="nav-auth"></span>
            </div>
        </div>
    </nav>

    <section class="section" style="padding-top: 110px;">
        <div class="shell">
            <div class="section-head">
                <div class="kicker">Your workspace</div>
                <h2>Saved jobs &amp; CV versions</h2>
                <p>Everything you tailor and save lives here — revisit, restore, or clean up.</p>
            </div>

            <div class="ws-grid">
                <div>
                    <h4 class="mb-3"><i class="bi bi-briefcase"></i> Saved jobs</h4>
                    <div id="jobsList"><div class="ws-empty">Loading…</div></div>
                </div>
                <div>
                    <h4 class="mb-3"><i class="bi bi-file-earmark-person"></i> Saved CVs</h4>
                    <div id="cvList"><div class="ws-empty">Loading…</div></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Version viewer modal -->
    <div class="modal fade" id="versionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="versionModalTitle">CV version</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control" id="versionLatex" rows="18" spellcheck="false" readonly style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" id="versionCopyBtn"><i class="bi bi-clipboard"></i> Copy LaTeX</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/csrf.js?v=1"></script>
    <script src="/static/workspace.js?v=1"></script>
</body>
</html>
