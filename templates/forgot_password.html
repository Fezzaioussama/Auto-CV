<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Auto-CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <link rel="stylesheet" href="/static/auth.css?v=3">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <section class="auth-panel" aria-label="Reset your password">
            <a class="brand auth-brand" href="{{ url_for('auth.login') }}">
                <span class="logo logo-image"><img src="/static/assets/autocv-logo.png" alt="" aria-hidden="true"></span>
                <span class="name">Auto<span>CV</span></span>
            </a>
            <h1 class="auth-title">Forgot your password?</h1>
            <p class="auth-sub">Enter your email and we'll send you a link to set a new one.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="auth-alert {{ 'error' if category == 'error' else 'info' }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.forgot_password') }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="auth-label" for="email">Email</label>
                <input class="form-control auth-input" id="email" name="email" type="email" autocomplete="email" required autofocus>

                <button class="btn btn-primary w-100 mt-4 auth-submit" type="submit">
                    <i class="bi bi-envelope-arrow-up"></i> Send reset link
                </button>
            </form>

            <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
        </section>
    </main>
</body>
</html>
